name: ci
# Two build tracks (same plugin source):
#  - v3.0.1: reconstructs the pinned UE4SS v3.0.1 dependency tree, builds
#    against it (era-pinned cmake 3.31 + rust 1.79 — see AGENTS.md), pairs
#    with the official v3.0.1 runtime.
#  - experimental: thin build against the ABI replica + vendored headers,
#    import lib generated from the official 'experimental-latest' rolling
#    release UE4SS.dll, then every import is verified against that runtime's
#    real export table. Pairs with experimental runtimes (Rai Pal's bundle).
# Both run the standalone smoke test path (exit-code gated).
# Pushes to main also publish a CalVer release (vYYYY.MM.DD, UTC) with both
# mod DLLs + README; a same-day rerun appends the run number
# (v2026.10.12.N) so tags stay unique — same handling as uevr-ogsa-ts.
# Action pins are Node-24 majors (checkout@v7, artifact@v7/v8,
# gh-release@v3).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    # Standalone serializer guard (no UE4SS needed): rebuilds the
    # standard's seven corpus vectors via the vendored core and
    # byte-compares, plus frame-conversion + deriver checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Open-Game-Standards-Alliance/OGSA-Telemetry-Standard
          path: OGSA-Telemetry-Standard
      - name: Configure + build
        run: |
          cmake -S Test -B Test/build
          cmake --build Test/build
      - name: Run conformance binary
        run: Test/build/ogsa_conformance
              "$GITHUB_WORKSPACE/OGSA-Telemetry-Standard/conformance"

  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"
      - uses: dtolnay/rust-toolchain@1.79
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare UE4SS dep tree
        run: ./prepare-ue4ss.ps1
        shell: pwsh
      - name: Build mod + smoke
        run: ./build-mod.cmd
        shell: cmd
      - name: Run smoke test
        run: |
          cmake --build build-ninja --target ogsa_smoke
          build-ninja\ogsa_smoke.exe
        shell: cmd
      - name: Upload mod artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ogsa_telemetry-mod-dll-v301
          path: build-ninja/main.dll
          if-no-files-found: error

  build-experimental:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Import lib from experimental runtime
        run: ./prepare-experimental.ps1
        shell: pwsh
      - name: Build experimental mod
        run: ./build-experimental.cmd
        shell: cmd
      - name: Verify imports against runtime exports
        shell: pwsh
        run: |
          $dumpbin = (Get-Command dumpbin.exe).Source
          $imports = & $dumpbin /IMPORTS build-exp/main.dll
          $ue4ssImports = @(); $inBlock = $false
          foreach ($line in $imports) {
            if ($line -match '^\s+(\S+\.dll)$') { $inBlock = ($Matches[1] -ieq 'UE4SS.dll'); continue }
            if ($inBlock -and $line -match '^\s+[0-9A-F]+\s+([?_][^\s]+)') { $ue4ssImports += $Matches[1] }
          }
          $exports = Get-Content build-exp/UE4SS.exports.txt | ForEach-Object {
            if ($_ -match '^\s*\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)$') { $Matches[1] }
          }
          $missing = $ue4ssImports | Where-Object { $_ -notin $exports }
          if ($missing) { Write-Host 'MISSING FROM RUNTIME EXPORTS:'; $missing; exit 1 }
          Write-Host "all $($ue4ssImports.Count) UE4SS.dll imports present in runtime exports"
      - name: ABI drift check (replica vs upstream + runtime)
        shell: pwsh
        run: ./check-experimental-abi.ps1
      - name: Upload mod artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ogsa_telemetry-mod-dll-experimental
          path: build-exp/main.dll
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-smoke, build-experimental]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the same-day tag check
          fetch-tags: true
      - name: Download v3.0.1 mod artifact
        uses: actions/download-artifact@v8
        with:
          name: ogsa_telemetry-mod-dll-v301
          path: dl-v301
      - name: Download experimental mod artifact
        uses: actions/download-artifact@v8
        with:
          name: ogsa_telemetry-mod-dll-experimental
          path: dl-exp
      - name: CalVer tag
        id: calver
        shell: bash
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="$base.${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        shell: pwsh
        run: |
          # zip layout: <variant>/ogsa_telemetry/{enabled.txt,dlls/main.dll}
          # + README.md at the root -- users copy the ogsa_telemetry
          # folder of their variant straight into <ue4ss>/Mods/.
          foreach ($v in @(@{dir='3.0.1'; src='dl-v301'}, @{dir='experimental'; src='dl-exp'})) {
            New-Item -ItemType Directory -Force -Path "$($v.dir)/ogsa_telemetry/dlls" | Out-Null
            Copy-Item "$($v.src)/main.dll" "$($v.dir)/ogsa_telemetry/dlls/main.dll"
            New-Item -ItemType File -Force -Path "$($v.dir)/ogsa_telemetry/enabled.txt" | Out-Null
          }
          $name = "ue4ss_ogsa_telemetry-$($env:TAG.TrimStart('v'))-win64.zip"
          Compress-Archive -Path '3.0.1', experimental, README.md -DestinationPath $name
          "zip=$name" >> $env:GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.calver.outputs.tag }}
          name: ${{ steps.calver.outputs.tag }}
          files: ${{ env.zip }}
          generate_release_notes: true
