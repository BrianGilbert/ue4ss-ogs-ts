name: ci
# Builds the mod against the experimental UE4SS runtime: thin build against
# the ABI replica + vendored headers, import lib generated from the official
# 'experimental-latest' rolling release UE4SS.dll, then every import is
# verified against that runtime's real export table. The standalone smoke
# test is exit-code gated.
# Pushes to main also publish a CalVer release (vYYYY.MM.DD, UTC) with the
# mod DLL + README; a same-day rerun appends the run number
# (v2026.10.12.N) so tags stay unique — same handling as uevr-ogs-ts.
# Action pins are Node-24 majors (checkout@v7, artifact@v7/v8,
# gh-release@v3).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    # Standalone serializer guard (no UE4SS needed): rebuilds the
    # standard's seven corpus vectors via the vendored core and
    # byte-compares, plus frame-conversion + deriver checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Open-Game-Standards/OGS-Telemetry-Standard
          path: OGS-Telemetry-Standard
      - name: Configure + build
        run: |
          cmake -S Test -B Test/build
          cmake --build Test/build
      - name: Run conformance binary
        run: Test/build/ogs_conformance
              "$GITHUB_WORKSPACE/OGS-Telemetry-Standard/conformance"

  build-experimental:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build + run smoke test
        run: |
          cmake -S Test -B Test/build
          cmake --build Test/build --config Release --target ogs_smoke
          Test\build\Release\ogs_smoke.exe
        shell: cmd
      - name: Import lib from experimental runtime
        run: ./prepare-experimental.ps1
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build experimental mod
        run: ./build-experimental.cmd
        shell: cmd
      - name: Verify imports against runtime exports
        shell: pwsh
        run: |
          $dumpbin = (Get-Command dumpbin.exe).Source
          $imports = & $dumpbin /IMPORTS build-exp/main.dll
          $ue4ssImports = @(); $inBlock = $false
          foreach ($line in $imports) {
            if ($line -match '^\s+(\S+\.dll)$') { $inBlock = ($Matches[1] -ieq 'UE4SS.dll'); continue }
            if ($inBlock -and $line -match '^\s+[0-9A-F]+\s+([?_][^\s]+)') { $ue4ssImports += $Matches[1] }
          }
          $exports = Get-Content build-exp/UE4SS.exports.txt | ForEach-Object {
            if ($_ -match '^\s*\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)$') { $Matches[1] }
          }
          $missing = $ue4ssImports | Where-Object { $_ -notin $exports }
          if ($missing) { Write-Host 'MISSING FROM RUNTIME EXPORTS:'; $missing; exit 1 }
          Write-Host "all $($ue4ssImports.Count) UE4SS.dll imports present in runtime exports"
      - name: ABI drift check (replica vs upstream + runtime)
        shell: pwsh
        run: ./check-experimental-abi.ps1
      - name: Upload mod artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ogs_telemetry-mod-dll-experimental
          path: build-exp/main.dll
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [conformance, build-experimental]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the same-day tag check
          fetch-tags: true
      - name: Download experimental mod artifact
        uses: actions/download-artifact@v8
        with:
          name: ogs_telemetry-mod-dll-experimental
          path: dl-exp
      - name: CalVer tag
        id: calver
        shell: bash
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="$base.${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        shell: pwsh
        run: |
          # zip layout: experimental/ogs_telemetry/{enabled.txt,dlls/main.dll}
          # + README.md at the root -- users copy the ogs_telemetry folder
          # straight into <ue4ss>/Mods/.
          New-Item -ItemType Directory -Force -Path experimental/ogs_telemetry/dlls | Out-Null
          Copy-Item dl-exp/main.dll experimental/ogs_telemetry/dlls/main.dll
          New-Item -ItemType File -Force -Path experimental/ogs_telemetry/enabled.txt | Out-Null
          $name = "ue4ss_ogs_telemetry-$($env:TAG.TrimStart('v'))-win64.zip"
          Compress-Archive -Path experimental, README.md -DestinationPath $name
          "zip=$name" >> $env:GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.calver.outputs.tag }}
          name: ${{ steps.calver.outputs.tag }}
          files: ${{ env.zip }}
          generate_release_notes: true
